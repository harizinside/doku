name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # ships npm 11.x; trusted publishing needs >= 11.5.1
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi
      - run: npm ci # runs `prepare` -> build
      - run: npm test
      - run: npm publish --access public
